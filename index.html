<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Pagina Web</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container">
    <div class="row g-4">
      
      <!-- Tarjeta 1 -->
      <div class="col-12 col-md-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
          <img src="ruta-de-tu-imagen1.jpg" class="card-img-top" alt="Oruro" style="height: 200px; object-fit: cover;">
          <div class="card-body">
            <h5 class="card-title text-danger fw-bold">Oruro</h5>
            <p class="card-text text-muted">Oruro es una ciudad ubicada en el altiplano de Bolivia. Es conocida por su historia minera...</p>
          </div>
        </div>
      </div>

      <!-- Tarjeta 2 -->
      <div class="col-12 col-md-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
          <img src="ruta-de-tu-imagen2.jpg" class="card-img-top" alt="Virgen del Socavón" style="height: 200px; object-fit: cover;">
          <div class="card-body">
            <h5 class="card-title text-danger fw-bold">Virgen del Socavón</h5>
            <p class="card-text text-muted">El monumento a la Virgen del Socavón es uno de los símbolos más representativos...</p>
          </div>
        </div>
      </div>

      <!-- Repite el bloque <div class="col-12 col-md-4"> para las demás tarjetas -->

    </div>
  </div>

</body>
</html>
